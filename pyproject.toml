[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elderly-ai-monitor"
version = "0.3.3"
description = "Real-time AI Camera Monitoring & Abnormal Behavior Detection System for Elderly Safety"
authors = [{ name = "Quốc Cường" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "ultralytics>=8.1.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0",
    "filterpy>=1.4.5",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "pydantic>=2.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "slowapi>=0.1.9",
    "cryptography>=41.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
    "psutil>=5.9.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
